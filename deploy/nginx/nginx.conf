# 律师专用多 Agent 法律咨询助手 —— Nginx 配置
#
# 两件事：
#   1. 托管 web/ 静态前端（挂在 /ui，与后端自己托管时一致）；
#   2. 把 /api 反代到 api:8001。
#
# 前端是 hash 路由（#/cases/xxx），所以**不需要** try_files 回退 ——
# 这正是当初选 hash 路由的原因：SPA 回退会让拼错的接口路径返回 HTML，
# 前端把它当 JSON 解析，报的错是"Unexpected token <"，完全看不出是 404。
#
# **下面为什么用一个变量而不是 upstream 块 —— 这是被一个真实故障换来的。**
# 原配置是：
#
#     upstream legal_api { server api:8001; keepalive 32; }
#
# 那样 nginx 只在**加载配置时**解析一次 ``api``，之后永久使用那个 IP。
# 而 Docker 容器每次重建都会换 IP —— 于是 ``docker compose restart api``
# （或者拉新版镜像重建）之后，nginx 仍然往那个已经消失的旧 IP 转发，
# 全站 **502 Bad Gateway**，但 api 容器自身是 healthy 的、自己访问 8001 也是 200。
# 表现是"后端看着完全正常，就是打不开"，排查方向基本必错。
#
# 开源版 nginx 的 upstream 块不支持运行时解析（``resolve`` 参数是 Plus 专属），
# 所以只能用**变量 + resolver**：写成变量时 nginx 会按 resolver 的 TTL 重新查询。
# 代价：失去 upstream 块的 keepalive 连接池，每个请求多一次 TCP 握手。
# 相比"重启一个服务就全站不可用"，这个取舍没有悬念。
#
# ``127.0.0.11`` 是 Docker 的内嵌 DNS，只在容器网络里存在。裸 ``docker run``
# 或别的编排方式下不存在这个地址，要换成真实 DNS（如 ``resolver 8.8.8.8``）。

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;
    # 写成变量，让 proxy_pass 走运行时解析（原因见文件头）。
    set $api_upstream "api:8001";

    # 合同 PDF 与扫描件动辄几十 MB。Nginx 默认 1m，
    # 超了返回 413 而**后端日志里一行都没有**（请求根本没到应用），
    # 表现是"上传大文件没反应"。
    client_max_body_size 200m;
    client_body_timeout 300s;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain;
    gzip_min_length 1024;

    # ------------------------------------------------------------ 前端静态资源
    location = /ui {
        return 301 /ui/;
    }
    location /ui/ {
        alias /usr/share/nginx/html/ui/;
        # 前端没有构建步骤，文件名**不带内容 hash**（就是 index.html + css/app.css）。
        # 这种情况下任何长缓存都是错的：发新版后浏览器拿到新 HTML、却仍用缓存里的
        # 旧 CSS，页面结构对不上样式，表现是"改了没生效"或"样式错乱"，而服务端
        # 早已是新文件，从服务端一侧完全查不出问题。
        # 所以这里一律 no-cache（用之前先回源问一句，ETag 命中照走 304，不牺牲性能）。
        # 别再加 expires / max-age：它会覆盖这条，让后端那层 no-cache 也形同虚设。
        add_header Cache-Control "no-cache";
    }

    location = / {
        return 302 /ui/;
    }

    # ------------------------------------------------------------ 接口
    location /api/ {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # **SSE（/api/v1/chat/stream）必须关掉缓冲。**
        # 开着的话 nginx 会攒够一块才吐给浏览器，于是"边审边看"变成
        # "全部跑完一次性出现" —— 功能没坏，体验全没了，
        # 而后端日志显示事件是正常发出的，排查时极容易被带偏。
        proxy_buffering off;
        proxy_cache off;
        # 关掉 nginx 自己的加速缓冲头（有些中间层会认它）
        proxy_set_header X-Accel-Buffering "no";
        chunked_transfer_encoding on;
        # 长任务（合同审查）单次要跑几十秒到几分钟。
        # 默认 60s 会在任务还没跑完时掐断连接，前端只看到"连接被重置"。
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;

        # 大文件下载（/drafts/{id}/download）别在内存里攒
        proxy_max_temp_file_size 0;
    }

    # 健康检查单独放行：**不需要登录**，运维探针不会因为没有 token 而失败。
    location = /health {
        proxy_pass http://$api_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
    }

    # ------------------------------------------------------------ WebSocket
    # 任务进度推送在 /ws/tasks/{task_id}（**没有 /api 前缀**，是根路径下挂载的）。
    # 少了 Upgrade 头，握手会以 200 返回然后立刻断开，前端看到的是
    # "连上了又马上断了"，而不是明确的 4xx —— 很难往代理配置上想。
    location /ws/ {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 长任务期间连接要一直开着，别被 60s 默认超时掐断
        proxy_read_timeout 1800s;
    }

    # ------------------------------------------------------------ 接口文档
    # FastAPI 的 docs 挂在**根路径** /docs，不在 /api/v1 下
    # （见 backend/app/main.py 的 docs_url）。转发时不能想当然加前缀。
    # 生产环境若不希望暴露，把这两段注掉即可。
    location = /docs {
        proxy_pass http://$api_upstream/docs;
        proxy_set_header Host $host;
    }
    location = /openapi.json {
        proxy_pass http://$api_upstream/openapi.json;
        proxy_set_header Host $host;
    }
}
